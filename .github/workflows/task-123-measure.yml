name: task123 worker-phase macOS diagnosis (do not merge)
on:
  pull_request:
    types: [opened]
    paths: [.github/workflows/task-123-measure.yml]
permissions:
  contents: read
concurrency:
  group: task123-worker-phase-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TASK123_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - name: Fixed-head preflight (all results retained)
        run: python3 scripts/task-123-measure.py preflight "$GITHUB_WORKSPACE/task123-output"
      - name: Twenty sequential diagnostic attempts, with paired slow-store fixtures
        if: always()
        run: python3 scripts/task-123-measure.py measure "$GITHUB_WORKSPACE/task123-output"
      - name: Preserve every phase buffer, raw log and outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task123-worker-phase-macos
          path: task123-output/
          if-no-files-found: error
          retention-days: 30
