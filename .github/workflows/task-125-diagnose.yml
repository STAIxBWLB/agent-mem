name: Task 125 disposable cursor and recovery diagnostics
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'measure/226-cursor-recovery'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Source receipt
        run: |
          mkdir -p "$RUNNER_TEMP/task125-diagnose"
          git rev-parse HEAD > "$RUNNER_TEMP/task125-diagnose/head.txt"
          git ls-files src scripts test/fakes/hooks-fixture.ts | while IFS= read -r file; do shasum -a 256 "$file"; done > "$RUNNER_TEMP/task125-diagnose/source-sha256.txt"
          bun --version > "$RUNNER_TEMP/task125-diagnose/bun.txt"
          sw_vers > "$RUNNER_TEMP/task125-diagnose/os.txt"
      - name: One raw hot-journal construction before recovery
        run: bun scripts/one-hot-journal-ffi-probe.ts --repo "$PWD" --out "$RUNNER_TEMP/task125-diagnose/one-hot" > "$RUNNER_TEMP/task125-diagnose/one-hot.stdout.log" 2> "$RUNNER_TEMP/task125-diagnose/one-hot.stderr.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task125-cursor-recovery-macos
          path: ${{ runner.temp }}/task125-diagnose
