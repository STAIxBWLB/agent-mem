name: hook-worker-attribution
on:
  # Retained stage2 evidence; feasibility revisions must not silently repeat completed C/P batches.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Counterbalanced C/P with identical finite contention (cap four complete pairs)
        run: bun scripts/run-hook-worker-pairs.ts "$RUNNER_TEMP/hook-worker-pairs"
      - name: Retain every attempt, strict failure and raw numeric receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hook-worker-pairs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hook-worker-pairs/
          retention-days: 14
