name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Frozen benchmark/runtime tests resolve their pinned base commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun scripts/check-boundary.ts
      - run: bun test --timeout 20000
      - run: npm pack --dry-run
      - run: bun scripts/measure-hooks-budget.ts
        if: always() && !cancelled()
      - name: Compare main Stop and SessionEnd RSS on the same runner
        if: always() && !cancelled()
        run: |
          git worktree add --detach "$RUNNER_TEMP/amem-hook-baseline" "${{ github.event.pull_request.base.sha || github.sha }}"
          bun scripts/measure-hook-baseline.ts --root "$RUNNER_TEMP/amem-hook-baseline"
      - run: bun scripts/measure-transcript-budget.ts
        if: always() && !cancelled()
      - run: bun scripts/measure-hook-stages.ts
        if: always() && !cancelled()
      - run: bun scripts/measure-budget.ts
        if: always() && !cancelled()
      - run: bun scripts/measure-mcp-budget.ts
        if: always() && !cancelled()
      - run: bun scripts/measure-shard-ac8.ts
        if: always() && !cancelled()
      - name: Installed tarball smoke in a clean HOME
        if: always() && !cancelled()
        run: bun scripts/smoke-installed-package.ts
      # npm 11 normalizes the manifest at publish and warns (0.3.1: "./bin/amem.js"); keep package.json already normalized.
      - name: package.json needs no npm auto-correction
        if: always() && !cancelled()
        run: npx -y npm@11.20.0 pkg fix && git diff --exit-code package.json
