name: check
# README/CHANGELOG and workflow docs are release inputs; identical-tree proof needs their normal check too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch only the frozen test runtime commits
        run: git fetch --no-tags --depth=1 origin 6d557ad6c9df158d25e312f9f751b37fc0d2499a 80764b5ad609f7c873bdd3f7490b974cc71b808b 265f509557b1aca4f08f015724595c94641de47e
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Seeded from macOS full-suite groups in run 42120864196 (whole-file milliseconds).
      # ponytail: cached weights only balance two shards; new files use Bun's median.
      # Refresh on dgx02: bun test --timings=test/ci-timings.json --update-timings
      - run: bun test --timeout 20000 --shard=${{ matrix.shard }}/2 --timings=test/ci-timings.json
  measure:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun scripts/check-boundary.ts
      - run: bun scripts/readme-facts.ts
      # Stale documentation stamps are warnings here; the release gate requires fresh ones.
      - name: Fetch ancestry for documentation stamps
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --filter=blob:none --unshallow origin
          fi
      - run: node scripts/check-docs.mjs
      - run: npm pack --dry-run
      - name: Console inbox small fixture (timing report-only)
        run: |
          set -o pipefail
          bun scripts/measure-ui-inbox.ts --projects=2 --candidates=40 --curated=50 --captures=20 --report-only-timing | tee ui-inbox-smoke.json
      - name: Retain console inbox fixture evidence
        if: always() && !cancelled()
        run: |
          {
            echo '## Console inbox fixture evidence'
            for inbox_result in ui-inbox-smoke.json; do
              if [ -f "$inbox_result" ]; then
                echo "### $inbox_result"
                echo '```json'
                cat "$inbox_result"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - run: bun scripts/measure-hooks-budget.ts
        if: always() && !cancelled()
      - name: Compare main Stop and SessionEnd RSS on the same runner
        if: always() && !cancelled()
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          if ! git cat-file -e "${BASELINE_SHA}^{commit}"; then git fetch --no-tags --depth=1 origin "$BASELINE_SHA"; fi
          git worktree add --detach "$RUNNER_TEMP/amem-hook-baseline" "$BASELINE_SHA"
          bun scripts/measure-hook-baseline.ts --root "$RUNNER_TEMP/amem-hook-baseline"
      - run: bun scripts/measure-transcript-budget.ts
        if: always() && !cancelled()
      - run: bun scripts/measure-hook-stages.ts
        if: always() && !cancelled()
      - run: bun scripts/measure-budget.ts
        if: always() && !cancelled()
      - run: bun scripts/measure-mcp-budget.ts
        if: always() && !cancelled()
      - run: bun scripts/measure-shard-ac8.ts
        if: always() && !cancelled()
      - name: Installed tarball smoke in a clean HOME
        if: always() && !cancelled()
        run: bun scripts/smoke-installed-package.ts
      # #199 AC6: this build against the previous published release on one shared home (spool, indexes, candidates, floors).
      # The release is resolved from the registry against package.json, so no edit is needed per release.
      - name: Previous-release (N-1) compatibility
        if: always() && !cancelled()
        env:
          AMEM_PREV_REQUIRED: "1"
        run: |
          read -r AMEM_PREV_VERSION AMEM_PREV_ROOT < <(bun scripts/previous-release.ts "$RUNNER_TEMP/amem-prev")
          echo "previous release: $AMEM_PREV_VERSION"
          AMEM_PREV_ROOT="$AMEM_PREV_ROOT" bun test --timeout 20000 test/previous-release.test.ts
      # npm 11 normalizes the manifest at publish and warns (0.3.1: "./bin/amem.js"); keep package.json already normalized.
      - name: package.json needs no npm auto-correction
        if: always() && !cancelled()
        run: npx -y npm@11.20.0 pkg fix && git diff --exit-code package.json
  # Matrix needs are coupled: either check name rejects any OS/shard failure, cancellation or skip.
  check:
    needs: [test, measure]
    if: always()
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard and measurement job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: |
          if [ "$TEST_RESULT" != success ] || [ "$MEASURE_RESULT" != success ]; then
            echo "::error::Required jobs did not all succeed (test=$TEST_RESULT, measure=$MEASURE_RESULT); inspect and fix or rerun the failed, cancelled or skipped upstream jobs."
            exit 1
          fi
          echo 'All required test and measurement jobs succeeded.'
