name: runner-probe-calibration
on:
  push:
    branches: [test/71-runner-probe]
permissions:
  contents: read
jobs:
  calibrate:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Before workload probe
        run: bun scripts/runner-probe.ts
      - name: Unchanged main budget workloads, healthy calibration only
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/measure-hooks-budget.ts | tee hook-calibration.jsonl
          bun scripts/measure-mcp-budget.ts | tee mcp-calibration.jsonl
          bun scripts/measure-budget.ts | tee capture-calibration.jsonl
          bun -e '
          const {readFileSync}=await import("node:fs");
          for(const file of ["hook-calibration.jsonl","mcp-calibration.jsonl","capture-calibration.jsonl"]){
            const text=readFileSync(file,"utf8"),at=text.lastIndexOf("\n{\n"),report=JSON.parse(text.slice(at<0?0:at+1));
            if(!report.pass)throw Error("unhealthy calibration workload");
            if(report.budgets?.R2?.groups&&Object.values(report.budgets.R2.groups).some(group=>!group.wallTimingPass||!group.peakPass))throw Error("advisory wall miss cannot calibrate");
            for(const line of text.split("\n")){if(!line.startsWith("{\"diagnostic\":\"budget-attempt\""))continue;const attempt=JSON.parse(line);if(attempt.attempt!==1||attempt.outcome!=="pass")throw Error("retried samples cannot calibrate");}
          }'
      - name: After workload probe
        run: bun scripts/runner-probe.ts
