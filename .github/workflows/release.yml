name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Match tag to package version
        run: bun -e 'const p = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("tag/package version mismatch");'
      # The GitHub Release body is the tag's CHANGELOG section; check it before anything is published.
      - name: CHANGELOG section for the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## ${version}" '$0==h{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md | grep -q '[^[:space:]]' || { echo "CHANGELOG.md has no section ## ${version}"; exit 1; }
      - run: bun install --frozen-lockfile
      # Same guard as check.yml: the tag workflow is the only publish path and check.yml does not run on tags.
      - name: package.json needs no npm auto-correction
        run: npx -y npm@11.20.0 pkg fix && git diff --exit-code package.json
      - run: bun x tsc --noEmit
      - run: bun scripts/check-boundary.ts
      - run: bun test --timeout 20000
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Match tag to package version
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("tag/package version mismatch");'
      # Trusted publishing (OIDC): no token; npm needs 11.5.1 or later and adds provenance by itself.
      - name: npm with trusted publishing support
        run: npm install -g npm@11.20.0
      - run: npm publish --access public
  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The section was validated in `check`, before npm publish.
      - name: Release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## ${version}" '$0==h{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section ## ${version}"; exit 1; }
          # Re-run safe: a Release made earlier (by hand or by a previous attempt) gets its notes replaced.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else gh release create "$GITHUB_REF_NAME" --verify-tag --title "@staix/agent-mem $GITHUB_REF_NAME" --notes-file notes.md; fi
