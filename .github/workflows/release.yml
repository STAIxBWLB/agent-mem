name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Match tag to package version
        run: bun -e 'const p = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("tag/package version mismatch");'
      - run: bun install --frozen-lockfile
      - run: bun x tsc --noEmit
      - run: bun scripts/check-boundary.ts
      - run: bun test --timeout 20000
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Match tag to package version
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("tag/package version mismatch");'
      # Trusted publishing (OIDC): no token; npm needs 11.5.1 or later and adds provenance by itself.
      - name: npm with trusted publishing support
        run: npm install -g npm@11.20.0
      - run: npm publish --access public
  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The GitHub Release body is the tag's CHANGELOG section; a missing or empty section fails the release.
      - name: Release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## ${version}" '$0==h{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section ## ${version}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "@staix/agent-mem $GITHUB_REF_NAME" --notes-file notes.md
