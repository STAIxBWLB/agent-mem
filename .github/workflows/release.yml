name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full main commit SHA for a read-only reuse dry run (never publishes)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reuse:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.proof.outputs.commit }}
      tree: ${{ steps.proof.outputs.tree }}
      tagObject: ${{ steps.proof.outputs.tagObject }}
      runId: ${{ steps.proof.outputs.runId }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prove identical-tree successful main check
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          RELEASE_TAG_NAME: ${{ github.event_name == 'push' && github.ref_name || '' }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/release-ci-reuse.mjs
  gate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: reuse
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.reuse.outputs.commit }}
          fetch-depth: 0 # This gate proves ancestry on main; other release checkouts are shallow.
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main"; exit 1; }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Match tag to package version
        run: bun -e 'const p = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("tag/package version mismatch");'
      # The GitHub Release body is the tag's CHANGELOG section; check it before anything is published.
      - name: CHANGELOG section for the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## ${version}" '$0==h{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md | grep -q '[^[:space:]]' || { echo "CHANGELOG.md has no section ## ${version}"; exit 1; }
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Same guard as check.yml: the tag workflow is the only publish path and check.yml does not run on tags.
      - name: package.json needs no npm auto-correction
        run: npx -y npm@11.20.0 pkg fix && git diff --exit-code package.json
      - run: bun x tsc --noEmit
      - run: bun scripts/check-boundary.ts
      - run: bun scripts/readme-facts.ts
      - name: Documentation stamps are fresh
        run: bun scripts/check-docs.ts --require-fresh
      - run: npm pack --dry-run
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [gate, reuse]
    outputs:
      commit: ${{ needs.reuse.outputs.commit }}
      tagObject: ${{ needs.reuse.outputs.tagObject }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.reuse.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Match tag to package version
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("tag/package version mismatch");'
      # Trusted publishing (OIDC): no token; npm needs 11.5.1 or later and adds provenance by itself.
      - name: npm with trusted publishing support
        run: npm install -g npm@11.20.0
      - name: Refuse a moved release tag before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ needs.reuse.outputs.commit }}
          RELEASE_TAG_NAME: ${{ github.ref_name }}
          RELEASE_TAG_OBJECT: ${{ needs.reuse.outputs.tagObject }}
        run: node scripts/release-ci-reuse.mjs --verify-tag-only
      - run: npm publish --access public
  release-notes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refuse a moved tag before Release edits
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ needs.publish.outputs.commit }}
          RELEASE_TAG_NAME: ${{ github.ref_name }}
          RELEASE_TAG_OBJECT: ${{ needs.publish.outputs.tagObject }}
        run: node scripts/release-ci-reuse.mjs --verify-tag-only
      # The section was validated in `gate`, before npm publish.
      - name: Release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## ${version}" '$0==h{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section ## ${version}"; exit 1; }
          # Re-run safe: a Release made earlier (by hand or by a previous attempt) gets its notes replaced.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else gh release create "$GITHUB_REF_NAME" --verify-tag --title "@staix/agent-mem $GITHUB_REF_NAME" --notes-file notes.md; fi
  site-dispatch:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # The portal (STAIxBWLB/agent-hub-site) re-syncs on each release. Skipped without the secret; never fails a release.
    env:
      SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - name: Notify agent-hub-site
        if: env.SITE_DISPATCH_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/STAIxBWLB/agent-hub-site/dispatches --method POST --input - <<EOF
          {"event_type":"product-release","client_payload":{"product":"amem","tag":"${GITHUB_REF_NAME}"}}
          EOF
