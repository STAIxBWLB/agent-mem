name: flake110
# Measurement branch only, never merge. Test the exact product commit without patching it.
on:
  pull_request:
    paths: [".github/workflows/flake110.yml"]
permissions:
  contents: read
jobs:
  loop:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        ref: [623a9cff904b5666ece4cd8eaaf4dd8968a84c80]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ matrix.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Run every iteration and retain exit codes and full logs
        shell: bash
        run: |
          mkdir -p flake110-results
          git rev-parse HEAD > flake110-results/head.txt
          failed=0
          for i in $(seq 1 20); do
            status=0
            bun test --max-concurrency=2 --timeout 20000 test/hook-transcript-worker.test.ts > "flake110-results/run-$i.log" 2>&1 || status=$?
            echo "$status" > "flake110-results/run-$i.exit"
            echo "RUN $i exit=$status"
            cat "flake110-results/run-$i.log"
            if [ "$status" -ne 0 ]; then failed=$((failed+1)); fi
          done
          echo "Failed iterations: $failed / 20" | tee flake110-results/verdict.txt
          test "$failed" -eq 0
      - name: Summarize all iterations, tests and metric cases
        if: always()
        shell: python
        run: |
          import collections, glob, json, pathlib, re
          root = pathlib.Path("flake110-results")
          tests = collections.Counter()
          passed_tests = collections.Counter()
          cases = {}
          exits = {}
          advisory_count = 0
          for log in sorted(root.glob("run-*.log")):
              exits[log.stem] = (root / (log.stem + ".exit")).read_text().strip()
              for line in log.read_text().splitlines():
                  if line.startswith("(pass) "):
                      passed_tests[re.sub(r" \[.*$", "", line[7:])] += 1
                  if line.startswith("(fail) "):
                      tests[re.sub(r" \[.*$", "", line[7:])] += 1
                  try:
                      row = json.loads(line)
                  except ValueError:
                      continue
                  if row.get("diagnostic") == "transcript-budget-stall-advisory":
                      advisory_count += 1
                  if row.get("diagnostic") != "task110-metrics":
                      continue
                  item = cases.setdefault(row["case"], collections.Counter())
                  for key in ["calls", "missing", "abandonedChildren", "unknownProvenanceRows", "drainSkipped"]:
                      item[key] += int(row[key])
          summary = {"exits": exits, "failuresPerTest": tests, "passesPerTest": passed_tests, "metricsPerCase": cases, "stallAdvisoryEvents": advisory_count, "stallClauseExercised": False}
          output = json.dumps(summary, indent=2, sort_keys=True)
          (root / "summary.json").write_text(output)
          print(output)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flake110-${{ matrix.os }}-${{ matrix.ref }}
          path: flake110-results/
